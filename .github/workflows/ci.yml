name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TorneoDeTitanes.sln

      - name: Build
        run: dotnet build TorneoDeTitanes.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test TorneoDeTitanes.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults
          if-no-files-found: ignore